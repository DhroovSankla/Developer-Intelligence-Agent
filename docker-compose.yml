version: '3.8'

services:
  vector-db:
    image: pgvector/pgvector:pg16
    container_name: developer_intelligence_vector_db
    environment:
      POSTGRES_USER: ${VECTOR_DB_USER}
      POSTGRES_PASSWORD: ${VECTOR_DB_PASSWORD}
      POSTGRES_DB: ai_knowledge_vector
    ports:
      - "5433:5432"
    volumes:
      - pgvector_data_v2:/var/lib/postgresql/data
    networks:
      - ai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-agent-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: developer_intelligence_agent_app
    ports:
      - "8083:8080"
    environment:
      # Inject the variables directly from local .env file into the container
      VECTOR_DB_URL: jdbc:postgresql://vector-db:5432/ai_knowledge_vector
      VECTOR_DB_USER: ${VECTOR_DB_USER}
      VECTOR_DB_PASSWORD: ${VECTOR_DB_PASSWORD}
    depends_on:
      vector-db:
        condition: service_healthy
    networks:
      - ai-network

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: developer_intelligence_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - ai-network

  grafana:
    image: grafana/grafana:11.0.0
    container_name: developer_intelligence_grafana
    ports:
      - "3000:3000"
    networks:
      - ai-network

volumes:
  pgvector_data_v2:

networks:
  ai-network:
    driver: bridge