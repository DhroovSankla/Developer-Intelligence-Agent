spring.application.name=developer-intelligence-agent

# Dynamic Database Handshake Mapping via Local Environment Variables
spring.datasource.url=${VECTOR_DB_URL}
spring.datasource.username=${VECTOR_DB_USER}
spring.datasource.password=${VECTOR_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Ollama Free Local Model Connections
spring.ai.ollama.base-url=http://host.docker.internal:11434
spring.ai.ollama.chat.options.model=qwen2:1.5b
spring.ai.ollama.embedding.options.model=nomic-embed-text

# PgVector Schema Configurations
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.index-type=hnsw

# Hibernate automatically create the table structures on boot if they don't exist
spring.jpa.hibernate.ddl-auto=update

# Management Actuator Endpoint Exposures
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# Add performance timers to incoming HTTP requests
management.metrics.web.server.request.autotime.enabled=true